<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cuadrantes Residencia</title>
<style>
/* ===================== RESET + BASE ===================== */
* { margin:0; padding:0; box-sizing:border-box; }
:root{
  --bg:#f4f5f7; --card:#ffffff; --ink:#1f2430; --muted:#6b7280;
  --line:#e2e5ea; --accent:#2563eb; --accent-d:#1d4ed8;
  --red:#dc2626; --red-bg:#fee2e2; --amber:#f59e0b; --amber-bg:#fef3c7;
  --ok:#16a34a; --ok-bg:#dcfce7; --info:#2563eb; --info-bg:#dbeafe;
  --shadow:0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.04);
}
html[data-theme="dark"]{
  --bg:#15181f; --card:#1e222b; --ink:#e6e8ee; --muted:#9aa0ab;
  --line:#2c313c; --accent:#3b82f6; --accent-d:#2563eb;
  --red-bg:#3a1e1e; --amber-bg:#3a2e12; --ok-bg:#13301c; --info-bg:#1c2540;
  --shadow:0 1px 3px rgba(0,0,0,.4), 0 1px 2px rgba(0,0,0,.2);
}
html,body{ height:100%; }
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:var(--bg); color:var(--ink); font-size:14px; line-height:1.4;
}
button{ font-family:inherit; cursor:pointer; border:none; }
input,select,textarea{ font-family:inherit; font-size:14px; }

/* ===================== HEADER ===================== */
header{
  position:sticky; top:0; z-index:50; background:var(--card);
  border-bottom:1px solid var(--line); box-shadow:var(--shadow);
  display:flex; align-items:center; gap:8px; padding:7px 14px; flex-wrap:wrap;
}
header h1{ font-size:15px; font-weight:700; letter-spacing:-.2px; margin-right:auto; }
header h1 .sub{ font-weight:400; color:var(--muted); font-size:13px; margin-left:8px;}
header .saved-tag{ font-size:10px; color:var(--muted); }
.btn{
  background:#fff; border:1px solid var(--line); color:var(--ink);
  padding:7px 12px; border-radius:8px; font-size:13px; font-weight:500;
  display:inline-flex; align-items:center; gap:6px; transition:.12s;
}
html[data-theme="dark"] .btn{ background:var(--card); }
.btn:hover{ background:#f8f9fb; border-color:#cbd1da; }
html[data-theme="dark"] .btn:hover{ background:#262b35; }
.btn:active{ transform:translateY(1px); }
.btn.primary{ background:var(--accent); border-color:var(--accent); color:#fff; }
.btn.primary:hover{ background:var(--accent-d); }
.btn.ghost{ background:transparent; border-color:transparent; color:var(--muted); }
.btn.ghost:hover{ background:#eef1f5; color:var(--ink); }
html[data-theme="dark"] .btn.ghost:hover{ background:#262b35; }
.btn.danger{ color:var(--red); border-color:#fecaca; }
.btn.danger:hover{ background:#fef2f2; }
.btn.sm{ padding:4px 9px; font-size:12px; }

/* ===================== MAIN / VISTAS ===================== */
main{ padding:12px 16px 40px; max-width:1500px; margin:0 auto; }
.view{ display:none; } .view.active{ display:block; }
.crumbs{ display:flex; align-items:center; gap:8px; color:var(--muted); font-size:12px; margin-bottom:6px;}
.crumbs a{ color:var(--accent); cursor:pointer; text-decoration:none; }
.crumbs a:hover{ text-decoration:underline; }
.crumbs .sep{ opacity:.5; }
.hint{ color:var(--muted); font-size:13px; }

.legal-notice{
  background:var(--amber-bg); border:1px solid #fde68a; color:#92400e;
  border-radius:8px; padding:6px 12px; font-size:12px; margin:8px 0;
  display:flex; gap:8px; align-items:center;
}
html[data-theme="dark"] .legal-notice{ color:#fcd34d; border-color:#5a4410;}
.legal-notice .x{ cursor:pointer; font-weight:700; }
.viability-warn{
  background:var(--red-bg); border:1px solid #fecaca; color:#b91c1c;
  border-radius:8px; padding:8px 12px; font-size:12px; margin:8px 0;
}
html[data-theme="dark"] .viability-warn{ color:#fca5a5; }

/* ===================== VISTA AÑOS ===================== */
.grid-years{ display:grid; grid-template-columns:repeat(auto-fill,minmax(170px,1fr)); gap:14px; }
.year-card{
  background:var(--card); border:1px solid var(--line); border-radius:12px;
  padding:22px 16px; box-shadow:var(--shadow); cursor:pointer; text-align:center;
  transition:.15s; position:relative;
}
.year-card:hover{ border-color:var(--accent); transform:translateY(-2px); }
.year-card .y{ font-size:30px; font-weight:700; letter-spacing:-1px; }
.year-card .meta{ font-size:12px; color:var(--muted); margin-top:4px;}
.year-card .del{ position:absolute; top:8px; right:8px; opacity:0; transition:.12s;}
.year-card:hover .del{ opacity:1; }
.empty-state{ text-align:center; padding:60px 20px; color:var(--muted); }
.empty-state .big{ font-size:46px; margin-bottom:10px; }

/* ===================== VISTA AÑO ===================== */
.grid-months{ display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:12px; }
.month-card{
  background:var(--card); border:1px solid var(--line); border-radius:10px;
  padding:16px 14px; box-shadow:var(--shadow); cursor:pointer; transition:.15s;
}
.month-card:hover{ border-color:var(--accent); transform:translateY(-2px); }
.month-card .m-name{ font-size:15px; font-weight:600; }
.month-card .m-range{ font-size:11px; color:var(--muted); margin-top:6px; }
.month-card .m-badge{ display:inline-block; margin-top:8px; font-size:10px; font-weight:600;
  padding:2px 7px; border-radius:20px; background:#eef1f5; color:var(--muted);}
.month-card.filled .m-badge{ background:var(--ok-bg); color:#15803d; }

/* ===================== EDITOR MES ===================== */
.mes-layout{ display:grid; grid-template-columns:1fr 320px; gap:14px; align-items:flex-start; }
.mes-layout.closed{ grid-template-columns:1fr; }
.mes-main{ min-width:0; }
.month-bar{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:6px;}
.month-bar h2{ font-size:16px; font-weight:700; }
.range-pill{ font-size:12px; color:var(--muted); background:#eef1f5; padding:4px 10px; border-radius:20px;}
.table-wrap{ overflow:auto; background:var(--card); border:1px solid var(--line); border-radius:10px; box-shadow:var(--shadow); max-height:68vh;}
table.cuad{ border-collapse:separate; border-spacing:0; width:100%; min-width:900px;}
table.cuad th, table.cuad td{ border-right:1px solid var(--line); border-bottom:1px solid var(--line); }
table.cuad tr:first-child th:first-child{ border-top-left-radius:10px;}
table.cuad thead th{
  position:sticky; top:0; background:#f8f9fb; z-index:2; padding:3px 0; text-align:center;
  font-weight:600; min-width:36px; max-width:40px; overflow:hidden;
}
html[data-theme="dark"] table.cuad thead th{ background:#262b35; }
table.cuad thead th .dnum{ font-size:13px; font-weight:700; display:block; }
table.cuad thead th .dlet{ font-size:10px; color:var(--muted); }
table.cuad thead th .fest-name{ font-size:8px; color:var(--red); font-weight:600; line-height:1; margin-top:1px; max-width:40px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
table.cuad thead th.sun{ background:var(--red-bg); }
table.cuad thead th.sun .dnum, table.cuad thead th.sun .dlet{ color:var(--red); }
table.cuad thead th.fest{ background:var(--red-bg);}
table.cuad thead th.fest .dnum, table.cuad thead th.fest .dlet{ color:var(--red); }
table.cuad thead th .th-btn{ background:transparent; border:none; padding:3px 0; display:flex; flex-direction:column; align-items:center; width:100%; cursor:pointer; border-radius:4px; transition:background .12s;}
table.cuad thead th .th-btn:hover{ background:rgba(37,99,235,.12); }
table.cuad thead th .cov-dot{ width:7px; height:7px; border-radius:50%; margin-top:1px; display:inline-block; }
table.cuad thead th .cov-dot.ok{ background:var(--ok); }
table.cuad thead th .cov-dot.bad{ background:var(--red); }
table.cuad thead th .cov-dot.warn{ background:var(--amber); }

table.cuad th.namecol{
  position:sticky; left:0; z-index:3; min-width:140px; text-align:left; padding:3px 8px;
  font-size:11px; font-weight:600; background:#f1f3f6;
}
html[data-theme="dark"] table.cuad th.namecol{ background:#262b35; }
table.cuad thead th.namecol{ z-index:4; border-top-left-radius:10px; }
table.cuad td.namecol{ position:sticky; left:0; z-index:1; background:var(--card); padding:4px 9px; font-weight:600; font-size:12px;}
html[data-theme="dark"] table.cuad td.namecol{ background:var(--card); }
table.cuad td.namecol .rol{ font-size:8px; color:var(--accent); font-weight:700; line-height:1; margin-bottom:1px; display:block;}
table.cuad td.namecol .nm{ font-size:12px; font-weight:600; line-height:1.2; display:block;}
table.cuad td.namecol .row-tools{ display:flex; gap:2px; margin-top:2px;}
table.cuad td.namecol .row-tools button{ font-size:9px; padding:1px 4px; border-radius:4px; background:transparent; color:var(--muted); border:1px solid var(--line);}
table.cuad td.namecol .row-tools button:hover{ background:#eef1f5; color:var(--ink);}
table.cuad td.cell{ text-align:center; vertical-align:middle; padding:0; height:32px; position:relative;}
table.cuad td.cell.sun{ background:var(--red-bg);}
table.cuad td.cell.fest{ background:var(--red-bg);}
table.cuad td.cell.fuera-mes{ opacity:.38; }
table.cuad td.cell.selected{ outline:2px solid var(--accent); outline-offset:-2px; }
table.cuad td.cell.flash{ animation:flash 1s ease; }
@keyframes flash{ 0%{box-shadow:0 0 0 3px var(--amber) inset;} 100%{box-shadow:none;} }
table.cuad td.cell button{ width:100%; height:100%; border:none; background:transparent; font-size:12px; font-weight:700; color:var(--ink); cursor:pointer; position:relative;}
table.cuad td.cell .lock{ position:absolute; top:1px; right:2px; font-size:8px; color:var(--ink); opacity:.7; pointer-events:none;}
table.cuad td.cell .note-dot{ position:absolute; bottom:1px; right:2px; font-size:9px; color:var(--ink); opacity:.8; pointer-events:none;}
table.cuad td.cell .tag{ display:inline-block; min-width:22px; padding:3px 4px; border-radius:5px; font-size:11px; font-weight:700;}

/* Panel de alertas lateral */
.alerts-panel{
  background:var(--card); border:1px solid var(--line); border-radius:10px;
  box-shadow:var(--shadow); position:sticky; top:64px; max-height:78vh; overflow:auto;
}
.alerts-panel .ap-head{ display:flex; align-items:center; gap:6px; padding:8px 10px; border-bottom:1px solid var(--line); position:sticky; top:0; background:var(--card); z-index:1;}
.alerts-panel .ap-head h4{ font-size:13px; font-weight:700; }
.alerts-panel .ap-head .badge{ font-size:10px; font-weight:700; padding:1px 7px; border-radius:20px; }
.alerts-panel .ap-head .badge.err{ background:var(--red-bg); color:var(--red);}
.alerts-panel .ap-head .badge.warn{ background:var(--amber-bg); color:#b45309;}
.alerts-panel .ap-head .close{ margin-left:auto; cursor:pointer; color:var(--muted);}
.alerts-panel .ap-empty{ padding:16px; text-align:center; color:var(--muted); font-size:12px;}
.alerts-panel .ap-item{ padding:7px 10px; border-bottom:1px solid var(--line); cursor:pointer; font-size:12px;}
.alerts-panel .ap-item:hover{ background:#eef1f5;}
html[data-theme="dark"] .alerts-panel .ap-item:hover{ background:#262b35;}
.alerts-panel .ap-item .ai-msg{ display:block;}
.alerts-panel .ap-item .ai-meta{ font-size:10px; color:var(--muted); margin-top:2px; display:block;}
.alerts-panel .ap-item.err{ border-left:3px solid var(--red);}
.alerts-panel .ap-item.warn{ border-left:3px solid var(--amber);}

/* Sección títulos */
.section-title{ font-size:14px; font-weight:700; margin:24px 0 10px; display:flex; align-items:center; gap:8px;}
.section-title .line{ flex:1; height:1px; background:var(--line);}

/* Tarjetas contadores */
.counters{ display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:10px;}
.c-card{ background:var(--card); border:1px solid var(--line); border-radius:10px; padding:12px; box-shadow:var(--shadow);}
.c-card .c-name{ font-weight:600; font-size:13px; margin-bottom:4px; }
.c-card .c-rol{ font-size:10px; color:var(--accent); font-weight:700; margin-bottom:8px;}
.c-stats{ display:flex; gap:6px; flex-wrap:wrap;}
.stat{ background:#f1f3f6; border-radius:8px; padding:5px 8px; text-align:center; min-width:46px;}
html[data-theme="dark"] .stat{ background:#262b35; }
.stat .v{ font-size:15px; font-weight:700; display:block;}
.stat .l{ font-size:9px; color:var(--muted); text-transform:uppercase; letter-spacing:.4px;}
.stat.tg{ background:#ffedd5;} .stat.tg .v{ color:#c2410c;}
.stat.g{ background:#fee2e2;} .stat.g .v{ color:#b91c1c;}
.stat.f{ background:var(--info-bg);} .stat.f .v{ color:#4338ca;}
.stat.w{ background:#dcfce7;} .stat.w .v{ color:#15803d;}
.stat.n{ background:#ede9fe;} .stat.n .v{ color:#6d28d9;}
.stat.h.bad{ background:#fee2e2;} .stat.h.bad .v{ color:#b91c1c;}
.stat.h.ok{ background:#dcfce7;} .stat.h.ok .v{ color:#15803d;}

/* Cobertura */
.cov-alerts{ background:#fff5f5; border:1px solid #fecaca; border-radius:8px; padding:8px 12px; font-size:12px; color:#b91c1c;}
html[data-theme="dark"] .cov-alerts{ background:#2a1414; color:#fca5a5;}
.cov-alerts li{ margin:2px 0; list-style:none;}
.cov-ok-box{ background:var(--ok-bg); border:1px solid #86efac; border-radius:8px; padding:8px 12px; font-size:12px; color:#15803d;}

/* popover turnos en celda */
.sv-pop{
  position:absolute; z-index:200; background:var(--card); border:1px solid var(--line); border-radius:10px;
  box-shadow:0 8px 24px rgba(0,0,0,.18); padding:6px; display:none; min-width:170px;
  max-height:340px; overflow:auto;
}
.sv-pop.show{ display:block;}
.sv-opt{ display:flex; align-items:center; gap:8px; padding:6px 8px; border-radius:6px; cursor:pointer; font-size:13px;}
.sv-opt:hover{ background:#eef1f5;}
html[data-theme="dark"] .sv-opt:hover{ background:#262b35;}
.sv-opt .dot{ width:14px; height:14px; border-radius:4px; border:1px solid rgba(0,0,0,.1);}
.sv-opt.clear{ color:var(--red); border-bottom:1px solid var(--line); margin-bottom:4px; border-radius:6px 6px 0 0;}
.sv-opt b{ min-width:26px;}
.sv-pop .pop-head{ font-size:11px; color:var(--muted); padding:2px 6px 6px; border-bottom:1px solid var(--line); margin-bottom:4px;}
.sv-pop .pop-act{ padding:6px 8px; border-top:1px solid var(--line); margin-top:4px; display:flex; gap:6px; flex-wrap:wrap;}
.sv-pop .pop-act button{ font-size:11px; padding:3px 7px; border-radius:5px; background:#f1f3f6; border:1px solid var(--line);}

.legend{ display:flex; gap:12px; flex-wrap:wrap; margin:10px 0; }
.legend .lg{ display:inline-flex; align-items:center; gap:5px; font-size:12px; color:var(--muted);}
.legend .lg .dot{ width:12px; height:12px; border-radius:3px; border:1px solid rgba(0,0,0,.1);}

/* ===================== MODAL ===================== */
.overlay{
  position:fixed; inset:0; background:rgba(15,23,42,.45); z-index:100;
  display:none; align-items:flex-start; justify-content:center; padding:40px 16px; overflow:auto;
}
.overlay.show{ display:flex; }
.modal{ background:var(--card); border-radius:14px; box-shadow:0 20px 60px rgba(0,0,0,.3);
  width:100%; max-width:580px; padding:22px; color:var(--ink); }
.modal.wide{ max-width:820px;}
.modal.xwide{ max-width:1050px;}
.modal h3{ font-size:18px; font-weight:700; margin-bottom:6px;}
.modal .closex{ float:right; }
.modal .row{ display:flex; gap:10px; align-items:center; margin-bottom:10px; flex-wrap:wrap;}
.modal label{ font-size:13px; font-weight:600; min-width:100px;}
.modal label.sm{ font-size:11px; font-weight:500; min-width:auto;}
.modal input[type=text],.modal input[type=number],.modal input[type=date],.modal input[type=color],.modal select,.modal textarea{
  border:1px solid var(--line); border-radius:8px; padding:7px 10px; flex:1; min-width:120px; background:var(--card); color:var(--ink);
}
.modal textarea{ min-height:50px; resize:vertical;}
.modal .actions{ display:flex; justify-content:flex-end; gap:8px; margin-top:16px; border-top:1px solid var(--line); padding-top:14px; flex-wrap:wrap;}

.list-edit{ display:flex; flex-direction:column; gap:8px; margin-bottom:12px;}
.list-item{ display:flex; align-items:center; gap:6px; background:#f8f9fb; border:1px solid var(--line); border-radius:8px; padding:7px 10px; flex-wrap:nowrap; overflow:hidden;}
html[data-theme="dark"] .list-item{ background:#1a1e26;}
.list-item.col{ flex-direction:column; align-items:stretch; gap:8px;}
.list-item input[type="text"]{ flex:1; min-width:0; }
.drag-handle{ cursor:grab; color:var(--muted); font-size:18px; line-height:1; user-select:none; padding:0 2px; flex-shrink:0;}
.drag-handle:active{ cursor:grabbing; }
.drag-item.dragging{ opacity:.4; }
.drag-item.drag-over{ border-top:2px solid var(--accent); box-shadow:0 -2px 0 var(--accent); }
.swatch{ width:30px; height:30px; border-radius:6px; border:1px solid var(--line); flex-shrink:0; padding:0; cursor:pointer; background:none;}

.chk-pill{ display:inline-flex; gap:4px; align-items:center; font-size:12px; font-weight:500; background:#f1f3f6; border:1px solid var(--line); border-radius:20px; padding:4px 11px; cursor:pointer; user-select:none; }
html[data-theme="dark"] .chk-pill{ background:#262b35;}
.chk-pill input{ margin:0; }
.chk-pill.on{ background:#dbeafe; border-color:var(--accent); color:var(--accent-d); font-weight:700; }

.tbl{ width:100%; border-collapse:collapse; font-size:12px;}
.tbl th, .tbl td{ border:1px solid var(--line); padding:4px 6px; text-align:center;}
.tbl th{ background:#f8f9fb; font-weight:600;}
html[data-theme="dark"] .tbl th{ background:#262b35;}
.tbl input, .tbl select{ border:1px solid var(--line); border-radius:5px; padding:3px 5px; width:100%; font-size:12px; min-width:0; background:var(--card); color:var(--ink);}

.filtros-bar{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:10px;}
.filtros-bar input, .filtros-bar select{ flex:0 1 auto; min-width:120px; max-width:200px;}

/* Print */
.print-title{ display:none; }
@media print{
  @page{ size:A4 landscape; margin:6mm; }
  html,body{ height:auto !important; overflow:hidden !important; }
  body *{ visibility:hidden !important; }
  .print-area, .print-area *{ visibility:visible !important; }
  .print-area{ position:absolute; left:0; top:0; right:0; width:100%; overflow:hidden; }
  .print-area .no-print{ display:none !important; }
  body{ background:#fff; }
  .print-title{ display:block; font-size:13px; font-weight:700; text-align:center;
    padding:6px 0 8px 0; margin-bottom:8px; border-bottom:2px solid #1f2430;
    -webkit-print-color-adjust:exact; print-color-adjust:exact; }
  .table-wrap{ border:none; box-shadow:none; overflow:hidden; max-height:none;}
  table.cuad{ min-width:0; width:100%; border-collapse:collapse; font-size:9px; table-layout:fixed; }
  table.cuad thead th{ position:static; padding:1px 0; width:auto;
    -webkit-print-color-adjust:exact; print-color-adjust:exact; }
  table.cuad thead th .th-btn{ cursor:default; }
  table.cuad thead th .dnum{ font-size:10px; } table.cuad thead th .dlet{ font-size:8px; }
  table.cuad th.namecol, table.cuad td.namecol{ position:static; width:80px; min-width:80px;
    text-align:left; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; padding:2px 4px 2px 6px; font-size:8px; line-height:1.2;
    background:#f1f3f6 !important; -webkit-print-color-adjust:exact; print-color-adjust:exact;}
  table.cuad td.cell{ height:20px; -webkit-print-color-adjust:exact; print-color-adjust:exact; }
  table.cuad td.cell.filled, table.cuad td.cell.sun, table.cuad td.cell.fest,
  table.cuad td.cell[style], .dot, .stat, .tag{
    -webkit-print-color-adjust:exact !important; print-color-adjust:exact !important;
  }
}
</style>
</head>
<body>

<header>
  <h1>🏥 Cuadrantes Residencia<span class="sub" id="hSub"></span><span class="sub" style="margin-left:14px;font-size:11px;">v3.0</span></h1>
  <span class="saved-tag" id="savedTag"></span>
  <button class="btn sm ghost no-print" onclick="openCentro()">Centro</button>
  <button class="btn sm ghost no-print" onclick="openTrabajadores()">Trabajadores</button>
  <button class="btn sm ghost no-print" onclick="openTurnos()">Turnos</button>
  <button class="btn sm ghost no-print" onclick="openCoberturas()">Coberturas</button>
  <button class="btn sm ghost no-print" onclick="openAusencias()">Ausencias</button>
  <button class="btn sm ghost no-print" onclick="openPlantillas()">Plantillas</button>
  <button class="btn sm ghost no-print" onclick="openFestivos()">Festivos</button>
  <button class="btn sm ghost no-print" onclick="openConfig()">Configuración</button>
  <button class="btn sm ghost no-print" onclick="openInformes()">Informes</button>
  <button class="btn sm ghost no-print" onclick="exportJSON()">Backup</button>
  <label class="btn sm ghost no-print" style="cursor:pointer;">Importar
    <input type="file" accept="application/json" style="display:none;" onchange="importJSON(event)">
  </label>
  <button class="btn sm ghost no-print" onclick="toggleTema()" id="themeBtn" title="Modo oscuro">🌙</button>

/* ============ PRNG reproducible (Fase 0.3) ============ */
function mulberry32(seed){
  let a = seed>>>0;
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a>>>15, 1 | a);
    t = t + Math.imul(t ^ t>>>7, 61 | t) ^ t;

}

/* ============ LOAD / MIGRATE / SAVE (Fase 0.2 + 0.3) ============ */
function load(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw){ const s = JSON.parse(raw); if(s){ migrate(s); return s; } }
    // intento de migrar desde v2 si no hay v3
    const rawV2 = localStorage.getItem('cuadrantes_residencia_v2');
    if(rawV2){ try{ const s2 = JSON.parse(rawV2); if(s2){ migrate(s2); save(s2); return s2; } }catch(e){} }
  }catch(e){ console.warn('load error',e); }
  const s = defaultState(); save(s); return s;
}
function migrate(s){
  if(!s.version || s.version < 3){
    // convertir asignaciones de string -> objeto
    (s.cuadrantes||{}).forEach==null; // noop guard
    Object.keys(s.cuadrantes||{}).forEach(y=>{
      const a = s.cuadrantes[y];
      (a.meses||{});
      Object.keys(a.meses||{}).forEach(idx=>{
        const m = a.meses[idx];
        if(!m) return;
        if(!m.notasDia) m.notasDia = {};
        if(m.asignaciones){
          Object.keys(m.asignaciones).forEach(k=>{
            const v = m.asignaciones[k];
            if(typeof v === 'string'){
              m.asignaciones[k] = { turno:v, origen: ORIGEN_MANUAL, bloqueado:false, nota:'', actualizadoEn:'', actualizadoPor:'' };
            }
          });
        }
      });
    });
    s.version = 3;
  }
  // rellenar campos nuevos
  if(!s.centro) s.centro = defaultState().centro;
  if(!s.centro.modoMes) s.centro.modoMes = 'natural';
  if(!s.trabajadores) s.trabajadores = [];
  if(!s.roles) s.roles = defaultRoles();
  if(!s.tiposTurno) s.tiposTurno = defaultTurnos();
  if(!s.config) s.config = defaultConfig();
  if(!s.config.reglaFinde) s.config.reglaFinde = 'sabado-domingo';
  if(!s.config.pesos) s.config.pesos = defaultConfig().pesos;
  if(!s.festivos) s.festivos = [];
  if(!s.coberturas) s.coberturas = defaultCoberturas();
  if(!s.ausencias) s.ausencias = [];
  if(!s.plantillas) s.plantillas = plantillasDemo();
  if(!s.cuadrantes) s.cuadrantes = {};
  if(!s.historialGeneraciones) s.historialGeneraciones = [];
  if(!s.descansosPendientes) s.descansosPendientes = [];
  // trabajadores: backfill
  s.trabajadores.forEach(t=>{
    if(!t.preferencias) t.preferencias = {turnosPermitidos:['M','T','N'],soloTurnos:false,soloTurnosTipo:'',noTrabajaNoches:false,noTrabajaFinesSemana:false,maxDiasConsecutivos:null,minDescansosTrasNoche:null,diasNoDisponibles:[],restriccionesSemanales:[]};
    if(!t.jornada) t.jornada = {horasAnualesObjetivo:1792,horasMensualesObjetivo:null,horasSemanalesObjetivo:40,porcentajeJornada:100};
    if(t.activo===undefined) t.activo = true;
    if(t.saldoInicialHoras===undefined) t.saldoInicialHoras = 0;
    if(!t.nombreCompleto) t.nombreCompleto = (t.apellidos||'')+', '+(t.nombre||'');
    if(!Array.isArray(t.preferencias.turnosPermitidos)) t.preferencias.turnosPermitidos=['M','T','N'];
  });
  // turnos: cubreCobertura/equivaleACobertura
  s.tiposTurno.forEach(t=>{
    if(t.cubreCobertura===undefined) t.cubreCobertura = !!t.trabajo && !['S','L'].includes(t.code);
    if(!t.equivaleACobertura) t.equivaleACobertura = [];
  });
  // turnos básicos presentes
  const existingCodes = new Set(s.tiposTurno.map(x=>x.code));
  BASICOS.forEach(code=>{
    if(!existingCodes.has(code)){
      const def = defaultTurnos().find(t=>t.code===code);
      if(def){ def.protected = true; s.tiposTurno.push(def); }
    } else {
      s.tiposTurno.find(t=>t.code===code).protected = true;
    }
  });
  // expandir coberturas antiguas 'festivo' en variantes granulares
  if(s.coberturas.some(c=>c.tipoDia==='festivo')){
    const nuevos = [];
    s.coberturas.filter(c=>c.tipoDia==='festivo').forEach(c=>{
      ['festivoLaborable','festivoSabado','festivoDomingo'].forEach(td=> nuevos.push({id:uid('cob'),tipoDia:td,turno:c.turno,rol:c.rol,min:c.min}) );
    });
    s.coberturas = s.coberturas.filter(c=>c.tipoDia!=='festivo').concat(nuevos);
  }
  s.actualizadoEn = s.actualizadoEn || nowISO();
  s.actualizadoPor = s.actualizadoPor || 'local';
}
function save(s, opts){
  if(s) state = s;
  state.actualizadoEn = nowISO();
  // backup rotatorio (no en cada save silencioso para no llenar)
  if(!opts || !opts.silent){
    try{
      // desplazar backups: 5<-4<-3<-2<-1<-actual
      for(let i=BACKUP_KEYS.length-1;i>0;i--){
        const prev = localStorage.getItem(BACKUP_KEYS[i-1]);
        if(prev) localStorage.setItem(BACKUP_KEYS[i], prev);
      }
      localStorage.setItem(BACKUP_KEYS[0], JSON.stringify(state));
    }catch(e){ console.warn('backup rotation failed', e); }
    actualizarSavedTag();
  }
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }catch(e){ console.warn('save error',e); }
}

/* ============ HELPERS FECHA ============ */
function fmt(d){ const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),da=String(d.getDate()).padStart(2,'0'); return `${y}-${m}-${da}`; }

function addDays(d,n){ const x=new Date(d); x.setDate(x.getDate()+n); return x; }
function diasEntre(ini,fin){ const out=[]; let d=new Date(ini); const f=new Date(fin); while(d<=f){ out.push(new Date(d)); d=addDays(d,1);} return out; }
// A qué mes natural (0..11) pertenece una fecha (para atribución correcta en modo operativo)
function mesNaturalDe(anyo, fechaStr){ const d = parse(fechaStr); return d.getMonth(); }

function turnoEsAusencia(code){ const t=turnoPorCode(code); return !!(t&&t.ausencia); }
function turnoBloqueaAuto(code){ const t=turnoPorCode(code); return !!(t&&t.bloqueaAuto); }
function turnoManual(code){ const t=turnoPorCode(code); return !t || (t.manual!==false); }
function isTurnoBasico(code){ return BASICOS.includes(code); }
// Cubre cobertura: un trabajador con este code cuenta para el bucket del turno base bt
function cubreElTurno(code, bt){
  if(code===bt) return true;
  const t = turnoPorCode(code);
  if(!t || !t.cubreCobertura) return false;
  return (t.equivaleACobertura||[]).includes(bt);
}
function textColorSobre(bg){
  if(!bg) return 'var(--ink)';
  const c = bg.replace('#',''); if(c.length<6) return 'var(--ink)';
  const r=parseInt(c.substr(0,2),16), g=parseInt(c.substr(2,2),16), b=parseInt(c.substr(4,2),16);
  const lum = (0.299*r + 0.587*g + 0.114*b)/255;
  return lum>0.55 ? '#1f2430' : '#ffffff';
}

/* ============ ACCESSORES DE ASIGNACIONES (Fase 1) ============ */
// El key usa '_' para separar tid y fecha (formato estable)
function aKey(tid, fecha){ return tid + '_' + fecha; }

function getMes(anyo, idx){ const a=getAnyo(anyo); if(!a.meses[idx]){ a.meses[idx] = { inicio:null, fin:null, asignaciones:{}, notasDia:{}, idx:idx }; } if(a.meses[idx].idx===undefined) a.meses[idx].idx=idx; if(!a.meses[idx].notasDia) a.meses[idx].notasDia={}; return a.meses[idx]; }
// Encuentra el mes (de cualquier año) que contiene una fecha
function mesQueContiene(fechaStr){
  for(const y of Object.keys(state.cuadrantes)){
    const a = state.cuadrantes[y];
    for(let i=0;i<12;i++){ const m=a.meses[i]; if(m && m.inicio && m.fin && fechaStr>=m.inicio && fechaStr<=m.fin) return {anyo:Number(y), idx:i, mes:m}; }
  }
  return null;
}
function getAsig(m, tid, fecha){ const k=aKey(tid,fecha); const v = m.asignaciones[k]; return (v && typeof v==='object') ? v : null; }
function getCodigo(m, tid, fecha){ const a=getAsig(m,tid,fecha); return a ? a.turno : ''; }
function getCodigoMes(anyo, idx, tid, fecha){ const m = state.cuadrantes[anyo] && state.cuadrantes[anyo].meses[idx]; return m ? getCodigo(m,tid,fecha) : ''; }
function setAsig(m, tid, fecha, code, meta){
  const k = aKey(tid, fecha);
  if(!code){ delete m.asignaciones[k]; return; }
  const prev = (m.asignaciones[k] && typeof m.asignaciones[k]==='object') ? m.asignaciones[k] : null;
  m.asignaciones[k] = {
    turno: code,
    origen: (meta && meta.origen) || prev?.origen || ORIGEN_MANUAL,
    bloqueado: (meta && meta.bloqueado!==undefined) ? meta.bloqueado : (prev?.bloqueado || false),
    nota: (meta && meta.nota!==undefined) ? meta.nota : (prev?.nota || ''),
    actualizadoEn: nowISO(),
    actualizadoPor: 'local'
  };
}
function delAsig(m, tid, fecha){ delete m.asignaciones[aKey(tid,fecha)]; }
function isBloqueadaAsig(asig){ return !!(asig && asig.bloqueado); }
function isAusenciaAsig(asig){ return !!(asig && asig.turno && turnoEsAusencia(asig.turno)); }
function isManualOReglaBloqueada(asig){ return !!(asig && (asig.bloqueado || asig.origen===ORIGEN_MANUAL)); }

/* ============ TIPO DE DÍA (Fase 5) ============ */
function tipoDiaDe(d){
  const ds=fmt(d); const dow=d.getDay();
  const fest = state.festivos.find(f=>f.fecha===ds);
  if(fest){
    if(dow===0) return 'festivoDomingo';
    if(dow===6) return 'festivoSabado';
    return 'festivoLaborable';
  }
  if(dow===0) return 'domingo';
  if(dow===6) return 'sabado';
  return 'laborable';
}
// ¿una cobertura de tipo cT aplica al tipoDia real td?
function coberturaAplica(cT, td){
  if(cT===td) return true;
  if(cT==='domingo' && td==='festivoDomingo') return true;
  if(cT==='sabado' && td==='festivoSabado') return true;
  if(cT==='festivoLaborable' && (td==='festivoSabado'||td==='festivoDomingo')) return false;
  return false;
}

/* ---- Definir rango de mes (con modo natural/operativo) ---- */
function rangoSugerido(anyo, idx){
  const modo = state.centro.modoMes || 'natural';
  if(modo==='natural'){
    // día 1 → último día natural
    const ultimoDia = new Date(anyo, idx+1, 0);
    return { ini:`${anyo}-${String(idx+1).padStart(2,'0')}-01`, fin: fmt(ultimoDia) };
  }
  // operativo: semanas completas lun→dom
  const primero = new Date(anyo, idx, 1);
  let lunIni = new Date(primero);
  if(lunIni.getDay()!==1){ lunIni = addDays(lunIni, -( (lunIni.getDay()+6)%7 )); }
  const ultimoDia = new Date(anyo, idx+1, 0);
  let domFin = new Date(ultimoDia);
  if(domFin.getDay()!==0){ domFin = addDays(domFin, 7-domFin.getDay()); }
  return { ini: fmt(lunIni), fin: fmt(domFin) };
}
function defineRangoMes(idx){
  const m = getMes(curAnyo, idx);
  const sug = rangoSugerido(curAnyo, idx);
  let sIni = sug.ini, sFin = sug.fin;
  // ajustes por meses contiguos definidos (continuidad)
  const prev = state.cuadrantes[curAnyo].meses[idx-1];
  if(prev && prev.fin) sIni = fmt(addDays(parse(prev.fin),1));
  const next = state.cuadrantes[curAnyo].meses[idx+1];
  if(next && next.inicio) sFin = fmt(addDays(parse(next.inicio),-1));
  if(m.inicio) sIni = m.inicio; if(m.fin) sFin = m.fin;
  promptBox(`Definir ${MESES_NOM[idx]} <span class="hint">(${state.centro.modoMes})</span>`,[
    {label:'Fecha inicio',type:'date',value:sIni,name:'ini'},
    {label:'Fecha fin',   type:'date',value:sFin,name:'fin'}
  ],(vals)=>{
    if(!vals.ini||!vals.fin){ alert('Indica ambas fechas.'); return false; }
    if(parse(vals.fin) < parse(vals.ini)){ alert('La fecha fin debe ser posterior a la inicio.'); return false; }
    m.inicio=vals.ini; m.fin=vals.fin; save(state);
    proyectarAusenciasEnMes(m);
    aplicarDescansosPendientesEnMes(m);
    renderAnio(); renderMes();
  });
}

/* ============ COBERTURA (Fase 5) ============ */
function coberturaDia(m, d){
  const ds=fmt(d); const tipo=tipoDiaDe(d);
  const conteo={};
  state.trabajadores.forEach(t=>{
    const code = getCodigo(m, t.id, ds);
    if(!code || !turnoEsTrabajo(code)) return;
    const rol = t.rol || '—';
    // para cada turno base configurado, ¿este code lo cubre?
    state.tiposTurno.forEach(bt=>{
      if(bt.trabajo && bt.cubreCobertura && cubreElTurno(code, bt.code)){
        const k = bt.code+'|'+rol; conteo[k]=(conteo[k]||0)+1;
      }
    });
  });
  const alerts=[]; let estado='ok', resumen='';
  const relevantes = state.coberturas.filter(c=>coberturaAplica(c.tipoDia, tipo));
  relevantes.forEach(c=>{ const k=c.turno+'|'+c.rol; const real=conteo[k]||0; if(real<c.min){ alerts.push(`${c.rol} ${c.turno}: ${real}/${c.min}`); estado='bad'; } });
  let overs=0; relevantes.forEach(c=>{ const k=c.turno+'|'+c.rol; const real=conteo[k]||0; if(real>c.min+3) overs++; });
  if(estado==='ok' && overs>0) estado='warn';
  resumen = alerts.length ? 'Faltan: '+alerts.join(', ') : (overs?'Excedente':'Completo');
  return { estado, alerts, resumen, conteo, tipo };
}
function calcularCoberturaMes(m, dias){ const out={}; dias.forEach(d=> out[fmt(d)]=coberturaDia(m,d)); return out; }
function renderCoberturaMes(m, dias, covPorDia){
  const alertsGlobal=[];
  dias.forEach(d=>{ const c=covPorDia[fmt(d)]; if(c&&c.alerts&&c.alerts.length) c.alerts.forEach(a=>alertsGlobal.push(`${fmt(d)} (${DIAS_LET[d.getDay()]}): ${a}`)); });
  let alertasHtml = alertsGlobal.length
    ? `<div class="cov-alerts"><b>⚠ Déficits de cobertura (${alertsGlobal.length}):</b><ul>${alertsGlobal.slice(0,40).map(a=>`<li>${escaparHTML(a)}</li>`).join('')}</ul>${alertsGlobal.length>40?`<li>... y ${alertsGlobal.length-40} más</li>`:''}</div>`
    : `<div class="cov-ok-box">✓ Cobertura mínima cumplida todos los días del mes.</div>`;
  const turnosTrabajo = state.tiposTurno.filter(t=>t.trabajo && t.cubreCobertura).map(t=>t.code);
  const matriz = dias.map(d=>{
    const ds=fmt(d); const c=covPorDia[ds];
    const row = turnosTrabajo.map(tc=>{
      let parts = state.roles.map(r=>{
        const real = c.conteo[tc+'|'+r]||0;
        const min = (state.coberturas.find(x=>coberturaAplica(x.tipoDia,c.tipoDia)&&x.turno===tc&&x.rol===r)||{}).min||0;
        if(!min && !real) return '';
        const cls = real<min?'bad':(real>min+3?'over':'ok');
        return `<span class="cov-chip ${cls}">${escaparHTML(r[0])}:${real}${min?'/'+min:''}</span>`;
      }).filter(Boolean).join(' ');
      return `<td>${parts||'—'}</td>`;
    }).join('');
    return `<tr><td>${ds} ${DIAS_LET[d.getDay()]}</td>${row}</tr>`;
  });
  const headMat = turnosTrabajo.map(tc=>`<th>${escaparHTML(tc)}</th>`).join('');
  return `<div class="section-title">Cobertura del mes <span style="font-weight:400;color:var(--muted);font-size:12px;">(verde=ok · rojo=déficit · azul=excedente)</span><span class="line"></span></div>
    ${alertasHtml}
    <div style="overflow:auto; max-height:260px; border:1px solid var(--line); border-radius:8px;">
      <table class="tbl"><thead><tr><th>Día</th>${headMat}</tr></thead><tbody>${matriz.join('')}</tbody></table>
    </div>`;
}

/* ============ ESTADÍSTICAS / FINDES (Fase 6) ============ */
// Decide si un trabajador trabajó el finde de un bloque V-S-D-L según reglaFinde
function trabajoEnFinde(m, t, bloque){
  const r = state.config.reglaFinde || 'sabado-domingo';
  const cSab = getCodigo(m, t.id, bloque.sab);
  const cDom = getCodigo(m, t.id, bloque.dom);
  const cVie = getCodigo(m, t.id, bloque.vie);
  const sabT = cSab && turnoEsTrabajo(cSab);
  const domT = cDom && turnoEsTrabajo(cDom);
  if(r==='sabado-domingo') return sabT || domT;
  if(r==='completo') return sabT && domT;
  if(r==='contar-viernes-noche'){ const vn = cVie==='N'; return sabT || domT || vn; }
  if(r==='contar-domingo-noche'){ const dn = cDom==='N'; return sabT || domT || dn; }
  return sabT || domT;
}
function bloquesFindes(m){
  if(!m||!m.inicio||!m.fin) return [];
  const dias = diasEntre(parse(m.inicio),parse(m.fin)); const out=[];
  for(let i=0;i<dias.length;i++){
    if(dias[i].getDay()===5){
      const v=dias[i], sab=i+1<dias.length?dias[i+1]:null, dom=i+2<dias.length?dias[i+2]:null, lun=i+3<dias.length?dias[i+3]:null;
      if(sab&&dom&&lun && sab.getDay()===6 && dom.getDay()===0 && lun.getDay()===1){
        out.push({vie:fmt(v),sab:fmt(sab),dom:fmt(dom),lun:fmt(lun)});
      }
    }
  }
  return out;
}
function calcularStatsMes(m, dias){
  const stats={};
  state.trabajadores.forEach(t=> stats[t.id]={horas:0,M:0,T:0,N:0,S:0,L:0,festivos:0,domingos:0,sabados:0,findes:0,nochesFinde:0,ausencias:0});
  const bloques = bloquesFindes(m);
  dias.forEach(d=>{
    const ds=fmt(d); const isDom=d.getDay()===0; const isSab=d.getDay()===6;
    const fest = state.festivos.find(f=>f.fecha===ds);
    state.trabajadores.forEach(t=>{
      const a = getAsig(m, t.id, ds); if(!a) return;
      const code=a.turno; const tn=turnoPorCode(code); if(!tn) return;
      if(tn.trabajo){ stats[t.id].horas+=(tn.horas||0); if(code==='M')stats[t.id].M++; if(code==='T')stats[t.id].T++; if(code==='N')stats[t.id].N++; if(code==='S')stats[t.id].S++; if(fest)stats[t.id].festivos++; if(isDom)stats[t.id].domingos++; if(isSab)stats[t.id].sabados++; }
      if(code==='L') stats[t.id].L++;
      if(tn.ausencia) stats[t.id].ausencias++;
    });
  });
  bloques.forEach(b=> state.trabajadores.forEach(t=>{ if(trabajoEnFinde(m,t,b)) stats[t.id].findes++; }));
  return stats;
}

/* Acumulado anual atribuyendo cada asignación a su MES NATURAL (no al grid) */
function calcularStatsAnyo(anyo){
  const stats={};
  state.trabajadores.forEach(t=> stats[t.id]={horas:0,M:0,T:0,N:0,S:0,L:0,festivos:0,domingos:0,sabados:0,findes:0,ausencias:0,porMes:{}});
  const a = state.cuadrantes[anyo]; if(!a) return stats;
  // recorrer días naturales 1..12
  for(let mn=0; mn<12; mn++){
    const diasNat = diasEntre(parse(anyo+'-'+String(mn+1).padStart(2,'0')+'-01'), parse(anyo+'-'+String(mn+2).padStart(2,'0')+'-01')>=0?addDays(new Date(anyo,mn+1,0),0):new Date(anyo,mn+1,0));
    // correcto: último día natural del mes mn
    const diasMesNat = diasEntre(new Date(anyo,mn,1), new Date(anyo,mn+1,0));
    const bloquesPorFecha={};
    // encontrar bloques finde del/los mes(es) grid que contengan estas fechas
    diasMesNat.forEach(d=>{
      const ds=fmt(d); const isDom=d.getDay()===0; const isSab=d.getDay()===6;
      const fest = state.festivos.find(f=>f.fecha===ds);
      state.trabajadores.forEach(t=>{
        // buscar asignación en cualquier mes grid que contenga ds
        const info = mesQueContiene(ds);
        let code=''; if(info){ code = getCodigo(info.mes, t.id, ds); }
        if(!code) return;
        const tn=turnoPorCode(code); if(!tn) return;
        if(tn.trabajo){ stats[t.id].horas+=(tn.horas||0); if(code==='M')stats[t.id].M++; if(code==='T')stats[t.id].T++; if(code==='N')stats[t.id].N++; if(code==='S')stats[t.id].S++; if(fest)stats[t.id].festivos++; if(isDom)stats[t.id].domingos++; if(isSab)stats[t.id].sabados++; }
        if(code==='L') stats[t.id].L++;
        if(tn.ausencia) stats[t.id].ausencias++;
      });
    });
  }
  // findes por bloque (atribuir al mes natural del sábado)
  for(let mn=0;mn<12;mn++){
    const diasMesNat = diasEntre(new Date(anyo,mn,1), new Date(anyo,mn+1,0));
    const viernes = diasMesNat.filter(d=>d.getDay()===5);
    viernes.forEach(v=>{
      const sab=addDays(v,1), dom=addDays(v,2), lun=addDays(v,3);
      if(sab.getDay()!==6||dom.getDay()!==0||lun.getDay()!==1) return;
      const bloque={vie:fmt(v),sab:fmt(sab),dom:fmt(dom),lun:fmt(lun)};
      // necesita un mes grid que contenga vie..lun
      const info=mesQueContiene(bloque.sab); if(!info) return;
      state.trabajadores.forEach(t=>{ if(trabajoEnFinde(info.mes,t,bloque)) stats[t.id].findes++; });
    });
  }
  return stats;
}
function renderContadores(m, dias){
  const stats = calcularStatsAnyo(curAnyo);
  const cards = state.trabajadores.map(t=>{
    const s=stats[t.id]||{};
    const horasObj = t.jornada.horasAnualesObjetivo || 1792;
    const saldo = (s.horas||0) - horasObj*monthOfYearProgress(curAnyo);

  }).join('');
  return `<div class="section-title">Contadores anuales ${curAnyo} <span style="font-weight:400;color:var(--muted);font-size:12px;">(atribución por mes natural · acumulado de meses definidos)</span><span class="line"></span></div>

function monthOfYearProgress(anyo){
  const a=state.cuadrantes[anyo]; if(!a) return 0;
  let defined=0; for(let i=0;i<12;i++){ if(a.meses[i]&&a.meses[i].inicio&&a.meses[i].fin) defined++; }
  return defined/12;
}

function setCell(tid, fecha, code){
  const m = getMes(curAnyo, curMesIdx);
  const prev = getAsig(m, tid, fecha);
  if(prev && prev.bloqueado){
    if(!confirm('Esta celda está bloqueada. ¿Asignar de todos modos?')){ closeSvPop(); return; }
  }
  if(code){
    // si es N, aplicar secuencia N→S→L
    if(code==='N' && state.config.secuenciaNocheObligatoria){
      setAsig(m, tid, fecha, 'N', {origen:ORIGEN_MANUAL, bloqueado:false});
      aplicarSecuenciaNoche(curAnyo, curMesIdx, tid, fecha);
    } else if(code==='N'){
      setAsig(m, tid, fecha, 'N', {origen:ORIGEN_MANUAL, bloqueado:false});
    } else {
      setAsig(m, tid, fecha, code, {origen:ORIGEN_MANUAL, bloqueado:false});
    }
  } else {
    // al borrar una N, limpiar S/L derivadas
    if(prev && prev.turno==='N'){ limpiarSecuenciaNoche(curAnyo, curMesIdx, tid, fecha); }
    delAsig(m, tid, fecha);
  }
  save(state); closeSvPop();
  // render de la celda + celdas adyacentes (por si cambió S/L)
  renderCelda(tid, fecha);
  const d=parse(fecha);
  ['S','L'].forEach((c,off)=>{ const fd=fmt(addDays(d,off+1)); renderCelda(tid, fd); });
}
function toggleBloqueo(tid, fecha){

  a.bloqueado = !a.bloqueado; a.actualizadoEn=nowISO();

/* ============ AUSENCIAS POR RANGO (Fase 2) ============ */
function proyectarAusenciasEnMes(m){
  if(!m.inicio||!m.fin||!state.ausencias) return;
  diasEntre(parse(m.inicio),parse(m.fin)).forEach(d=>{
    const ds=fmt(d);
    state.ausencias.forEach(aus=>{
      if(ds>=aus.inicio && ds<=aus.fin){
        // no sobreescribir celdas manuales bloqueadas
        const cur = getAsig(m, aus.trabajadorId, ds);
        if(cur && cur.origen===ORIGEN_MANUAL && cur.bloqueado) return;
        setAsig(m, aus.trabajadorId, ds, aus.tipo, {origen:ORIGEN_AUSENCIA, bloqueado: aus.bloqueada!==false});
      }
    });
  });
}
function proyectarTodasAusencias(){
  Object.keys(state.cuadrantes).forEach(y=>{
    const a=state.cuadrantes[y];
    for(let i=0;i<12;i++){ if(a.meses[i]&&a.meses[i].inicio) proyectarAusenciasEnMes(a.meses[i]); }

}

function saveAusencia(id){
  const tId=document.getElementById('au-t').value;
  const tipo=document.getElementById('au-tipo').value;
  const ini=document.getElementById('au-ini').value, fin=document.getElementById('au-fin').value;

}

/* ============ SECUENCIA N → S → L (Fase 3) ============ */
function aplicarSecuenciaNoche(anyo, idx, tid, fechaN){
  const d = parse(fechaN);
  const pasos = [['S',1],['L',2]];
  pasos.forEach(([code, off])=>{
    const fd = addDays(d, off); const ds = fmt(fd);
    const info = mesQueContiene(ds);
    if(info){
      const cur = getAsig(info.mes, tid, ds);
      if(cur && cur.origen===ORIGEN_MANUAL && cur.bloqueado) return; // no sobreescribir manual bloqueado
      setAsig(info.mes, tid, ds, code, {origen:ORIGEN_REGLA, bloqueado:true});
    } else {
      // mes no definido: pendiente
      state.descansosPendientes.push({tid, fecha:ds, code, origenAnyo:anyo});
    }
  });
}
function limpiarSecuenciaNoche(anyo, idx, tid, fechaN){
  const d = parse(fechaN);
  [['S',1],['L',2]].forEach(([code,off])=>{
    const ds = fmt(addDays(d,off));
    const info = mesQueContiene(ds);
    if(info){
      const cur = getAsig(info.mes, tid, ds);
      if(cur && cur.origen===ORIGEN_REGLA && cur.turno===code) delAsig(info.mes, tid, ds);
    }
  });
}
function aplicarDescansosPendientesEnMes(m){
  if(!m.inicio||!m.fin||!state.descansosPendientes||!state.descansosPendientes.length) return;
  const aplicados=[];
  state.descansosPendientes.forEach((lp,i)=>{
    if(lp.fecha>=m.inicio && lp.fecha<=m.fin){
      const cur = getAsig(m, lp.tid, lp.fecha);
      if(!cur || !cur.bloqueado){ setAsig(m, lp.tid, lp.fecha, lp.code, {origen:ORIGEN_REGLA, bloqueado:true}); }
      aplicados.push(i);
    }
  });
  aplicados.sort((a,b)=>b-a).forEach(i=>state.descansosPendientes.splice(i,1));
}

/* ============ VALIDADOR INTEGRAL (Fase 4) ============ */
// Devuelve {errores:[{tid,fecha,msg,tipo}], advertencias:[...]}
function validarCuadrante(anyo, idx){
  const m = state.cuadrantes[anyo] && state.cuadrantes[anyo].meses[idx];
  const errores=[], advs=[];
  if(!m || !m.inicio || !m.fin) return {errores:[{tid:'',fecha:'',msg:'Mes no definido',tipo:'estructura'}], advertencias:[]};
  const dias = diasEntre(parse(m.inicio), parse(m.fin));
  const cfg = state.config;
  dias.forEach(d=>{
    const ds=fmt(d); const tipo=tipoDiaDe(d);
    state.trabajadores.forEach(t=>{
      const a = getAsig(m, t.id, ds); if(!a) return;
      const code=a.turno;
      // inactivo asignado
      if(!t.activo){ errores.push({tid:t.id, fecha:ds, msg:`${t.nombreCompleto} está inactivo pero tiene ${code}`, tipo:'inactivo'}); return; }
      const tn = turnoPorCode(code); if(!tn) return;
      const p=t.preferencias;
      // turno no permitido
      if(tn.trabajo && p.turnosPermitidos && !p.turnosPermitidos.includes(code)){
        errores.push({tid:t.id, fecha:ds, msg:`${t.nombreCompleto}: turno ${code} no permitido`, tipo:'noPermitido'});
      }
      // turno fijo
      if(p.soloTurnos && p.soloTurnosTipo && tn.trabajo && code!==p.soloTurnosTipo){
        errores.push({tid:t.id, fecha:ds, msg:`${t.nombreCompleto}: solo puede hacer ${p.soloTurnosTipo}`, tipo:'fijo'});
      }
      // no trabaja noches
      if(code==='N' && p.noTrabajaNoches){ errores.push({tid:t.id, fecha:ds, msg:`${t.nombreCompleto}: no trabaja noches`, tipo:'noNoches'}); }
      // no findes
      if((d.getDay()===0||d.getDay()===6) && p.noTrabajaFinesSemana && tn.trabajo){
        errores.push({tid:t.id, fecha:ds, msg:`${t.nombreCompleto}: no trabaja fines de semana`, tipo:'noFindes'});
      }
      // día no disponible
      if((p.diasNoDisponibles||[]).includes(ds) && tn.trabajo){
        errores.push({tid:t.id, fecha:ds, msg:`${t.nombreCompleto}: día no disponible`, tipo:'noDisponible'});
      }
      // turno asignado durante ausencia (ausencia misma fecha)
      const ausMisma = state.ausencias.find(au=> au.trabajadorId===t.id && ds>=au.inicio && ds<=au.fin);
      if(ausMisma && tn.trabajo){
        errores.push({tid:t.id, fecha:ds, msg:`${t.nombreCompleto}: trabaja durante ${ausMisma.tipo} (${ausMisma.inicio}→${ausMisma.fin})`, tipo:'duranteAusencia'});
      }
      // reglas entre días consecutivos
      const codY = getCodigo(m, t.id, fmt(addDays(d,1)));
      const codAyer = getCodigo(m, t.id, fmt(addDays(d,-1)));
      // N seguida de M
      if(code==='N' && codY && (codY==='M' || codY==='T') && !cfg.permitirIncompatibles){
        errores.push({tid:t.id, fecha:ds, msg:`${t.nombreCompleto}: noche seguida de ${codY} al día siguiente`, tipo:'incompatible'});
      }
      // secuencia N->S->L
      if(cfg.secuenciaNocheObligatoria && code==='N' && codY!=='S' && codY!==''){
        errores.push({tid:t.id, fecha:ds, msg:`${t.nombreCompleto}: tras noche debería ir S (hay ${codY||'nada'})`, tipo:'secuenciaNSL'});
      }
      // max noches consecutivas
      if(code==='N'){
        let c=0, off=0; while(getCodigo(m,t.id,fmt(addDays(d,off)))==='N'){ c++; off++; }
        if(c>cfg.maxNochesConsecutivas) errores.push({tid:t.id, fecha:ds, msg:`${t.nombreCompleto}: ${c} noches consecutivas (máx ${cfg.maxNochesConsecutivas})`, tipo:'maxNoches'});
      }
      // max días consecutivos
      if(tn.trabajo){
        const maxC = (p.maxDiasConsecutivos!=null?p.maxDiasConsecutivos:cfg.maxDiasConsecutivos);
        let c=0, off=0;
        while(true){ const cd=getCodigo(m,t.id,fmt(addDays(d,off))); if(cd&&turnoEsTrabajo(cd)){ c++; off++; } else break; }
        if(c>maxC) errores.push({tid:t.id, fecha:ds, msg:`${t.nombreCompleto}: ${c} días consecutivos (máx ${maxC})`, tipo:'maxConsec'});
      }
    });
  });
  // cobertura mínima
  dias.forEach(d=>{ const c=coberturaDia(m,d); c.alerts.forEach(al=> errores.push({tid:'', fecha:fmt(d), msg:`Cobertura: ${al}`, tipo:'cobertura'})); });
  // saldos mensuales (advertencia)
  const stats = calcularStatsMes(m, dias);
  state.trabajadores.forEach(t=>{
    const s=stats[t.id]; if(!s) return;
    const obj = (t.jornada.horasMensualesObjetivo || (t.jornada.horasSemanalesObjetivo*4.33));
    const saldo = s.horas - obj;
    if(Math.abs(saldo) > cfg.toleranciaSaldoMensual){
      advs.push({tid:t.id, fecha:'', msg:`${t.nombreCompleto}: saldo mensual ${saldo>0?'+':''}${saldo.toFixed(0)}h (tolerancia ±${cfg.toleranciaSaldoMensual}h)`, tipo:'saldoMes'});
    }
    if(cfg.avisoExcesoHorasMensual && s.horas > cfg.umbralExcesoHorasMensual){
      advs.push({tid:t.id, fecha:'', msg:`${t.nombreCompleto}: ${s.horas.toFixed(0)}h este mes (umbral ${cfg.umbralExcesoHorasMensual}h)`, tipo:'excesoHoras'});
    }
  });
  return {errores, advertencias:advs};
}
function renderAlertasPanel(){
  const panel = document.getElementById('alertsPanel'); if(!panel) return;
  const res = validarCuadrante(curAnyo, curMesIdx);
  const errs = res.errores.length, warns = res.advertencias.length;
  let head = `<div class="ap-head">
    <h4>🔔 Alertas</h4>
    ${errs?`<span class="badge err">${errs} err</span>`:''}
    ${warns?`<span class="badge warn">${warns} aviso</span>`:''}
    <span class="close" onclick="_vistaMes.panelAlertas=false;renderMes()">✕</span></div>`;
  let body='';
  if(!errs && !warns){ body = `<div class="ap-empty">✓ Sin incidencias. Cuadrante válido.</div>`; }
  else {
    body = res.errores.map(e=>`<div class="ap-item err" onclick="saltarA('${e.tid}','${e.fecha}')">
      <span class="ai-msg">${escaparHTML(e.msg)}</span>${e.fecha?`<span class="ai-meta">${e.fecha}</span>`:''}</div>`).join('');
    body += res.advertencias.map(e=>`<div class="ap-item warn" onclick="saltarA('${e.tid}','${e.fecha}')">
      <span class="ai-msg">${escaparHTML(e.msg)}</span></div>`).join('');
  }
  panel.innerHTML = head+body;
}
function saltarA(tid, fecha){
  if(!fecha) return;
  const td = document.querySelector(`table.cuad td.cell[data-tid="${cssEscape(tid)}"][data-fecha="${fecha}"]`);
  if(td){ td.scrollIntoView({block:'center', inline:'center'}); td.classList.add('flash'); setTimeout(()=>td.classList.remove('flash'),1000); }
}

/* ============ GENERADOR (Fase 7) ============ */
function snapshotMes(anyo, idx){
  const m = state.cuadrantes[anyo] && state.cuadrantes[anyo].meses[idx];
  if(!m) return {};
  return JSON.parse(JSON.stringify(m.asignaciones||{}));
}
function restaurarSnapshot(anyo, idx, snap){
  const m = getMes(anyo, idx);
  m.asignaciones = JSON.parse(JSON.stringify(snap||{}));
}
// preasignación: ausencias, bloqueos manuales y turnos fijos ya están en asignaciones
function generarConUI(){
  const m = getMes(curAnyo, curMesIdx);
  if(!m.inicio||!m.fin){ alert('Define primero el rango del mes.'); return; }
  const html = `<h3>⚙ Generar planificación</h3>
    <p class="hint">Se conservarán ausencias, celdas manuales bloqueadas y turnos fijos. Se proyectan ausencias y se aplica la secuencia N→S→L si está activada.</p>
    <div class="row"><label class="sm">Semilla</label><input type="number" id="gen-seed" value="${Math.floor(Math.random()*1e9)}"></div>
    <div class="row"><label class="sm">Fase de mejora local</label><label class="chk-pill on"><input type="checkbox" id="gen-local" checked> Activar intercambios para equilibrar</label></div>
    <div class="actions"><button class="btn" onclick="closeModal()">Cancelar</button>
      <button class="btn primary" onclick="runGenerar()">Generar</button></div>`;
  openModal(html);
}
function runGenerar(){
  const seed = parseInt(document.getElementById('gen-seed').value)||1;
  const local = document.getElementById('gen-local').checked;
  closeModal();
  generarAutomatico(seed, local);
}
function generarAutomatico(seed, mejoraLocal){
  const anyo=curAnyo, idx=curMesIdx;
  const m = getMes(anyo, idx);
  const snap = snapshotMes(anyo, idx);
  const cfg = state.config; const pesos = cfg.pesos||{};
  const turnosTrabajo = state.tiposTurno.filter(t=>t.trabajo).sort((a,b)=>(a.orden||99)-(b.orden||99));
  const dias = diasEntre(parse(m.inicio), parse(m.fin));
  const rng = mulberry32(seed);

  // Fase 0: proyectar ausencias y descansos pendientes
  proyectarAusenciasEnMes(m);
  aplicarDescansosPendientesEnMes(m);

  // Limpiar asignaciones automáticas previas (no manuales, no ausencias, no regla)
  dias.forEach(d=>{
    const ds=fmt(d);
    state.trabajadores.forEach(t=>{
      const a=getAsig(m,t.id,ds);
      if(a && (a.origen===ORIGEN_AUTO || (!a.bloqueado && a.origen!==ORIGEN_MANUAL && a.origen!==ORIGEN_AUSENCIA && a.origen!==ORIGEN_REGLA))){
        delAsig(m,t.id,ds);
      }
    });
  });

  // Acumulado anual para equidad
  const acum = initAcumStats(anyo);

  // Fase 1: prioridad de necesidades. Ordenar días asc; dentro de cada día, Noche antes, Enfermería antes.
  const ordenTurnos = (a,b)=> (a.code==='N'?0:1)-(b.code==='N'?0:1) || (a.orden-b.orden);
  const turnosOrdenados = turnosTrabajo.slice().sort(ordenTurnos);

  const noCubiertas=[];
  dias.forEach(d=>{
    const ds=fmt(d); const tipo=tipoDiaDe(d);
    turnosOrdenados.forEach(tn=>{
      const rolesOrd = [...new Set(state.coberturas.filter(c=>coberturaAplica(c.tipoDia,tipo)&&c.turno===tn.code).map(c=>c.rol))]
        .sort((a,b)=> (a==='Enfermería'?0:1)-(b==='Enfermería'?0:1));
      rolesOrd.forEach(rol=>{
        const min = (state.coberturas.find(c=>coberturaAplica(c.tipoDia,tipo)&&c.turno===tn.code&&c.rol===rol)||{}).min||0;
        let cubierto = state.trabajadores.filter(t=> t.rol===rol && getCodigo(m,t.id,ds)===tn.code).length;
        for(; cubierto<min; cubierto++){
          const cand = elegirCandidato(tn, rol, d, m, acum, cfg, pesos, rng);
          if(!cand){ noCubiertas.push(`${ds} ${tn.code} ${rol} (min ${min})`); break; }
          setAsig(m, cand.id, ds, tn.code, {origen:ORIGEN_AUTO, bloqueado:false});
          actualizarAcum(acum, cand.id, tn.code, d);
          if(tn.code==='N' && cfg.secuenciaNocheObligatoria) aplicarSecuenciaNoche(anyo, idx, cand.id, ds);
        }
      });
    });
    // descansos: asignar L a quien lleve muchos días seguidos sin descanso y no tenga turno
    state.trabajadores.forEach(t=>{
      if(!t.activo) return;
      const ds2=fmt(d); if(getCodigo(m,t.id,ds2)) return;
      const ult = ultimosDiasTrabajados(m, t.id, d);
      const maxC = (t.preferencias.maxDiasConsecutivos!=null?t.preferencias.maxDiasConsecutivos:cfg.maxDiasConsecutivos);
      if(ult>=maxC){ setAsig(m, t.id, ds2, 'L', {origen:ORIGEN_AUTO, bloqueado:false}); }
    });
  });

  // Fase 2: mejora local por semana (intercambios)
  if(mejoraLocal) mejoraLocalIntercambios(m, dias, acum, cfg, pesos);

  // Historial con snapshot
  state.historialGeneraciones.push({fecha:nowISO(), anyo, mes:idx, seed, snapshot:snap});
  if(state.historialGeneraciones.length>10) state.historialGeneraciones.shift();
  save(state);

  const val = validarCuadrante(anyo, idx);
  let msg = `Generación completada (semilla ${seed}).`;
  if(noCubiertas.length) msg += `\n\nNo se pudo cubrir ${noCubiertas.length} necesidad(es):\n`+noCubiertas.slice(0,10).join('\n')+(noCubiertas.length>10?`\n...y ${noCubiertas.length-10} más`:'');
  if(val.errores.length) msg += `\n\nQuedan ${val.errores.length} error(es) tras la generación. Revisa el panel de alertas.`;
  alert(msg);
  renderMes();
}
function initAcumStats(anyo){
  const acum={}; state.trabajadores.forEach(t=> acum[t.id]={horas:0,M:0,T:0,N:0,findes:0,domingos:0,festivos:0,total:0});
  const a=state.cuadrantes[anyo]; if(!a) return acum;
  for(let i=0;i<12;i++){
    const m=a.meses[i]; if(!m||!m.inicio||!m.fin) continue;
    const ds=diasEntre(parse(m.inicio),parse(m.fin));
    const bloques=bloquesFindes(m);
    ds.forEach(d=>{
      const dateStr=fmt(d); const fest=state.festivos.find(f=>f.fecha===dateStr); const isDom=d.getDay()===0;
      state.trabajadores.forEach(t=>{
        const code=getCodigo(m,t.id,dateStr); if(!code) return;
        const tn=turnoPorCode(code); if(!tn) return;
        if(tn.trabajo){ acum[t.id].horas+=(tn.horas||0); acum[t.id].total++; if(code==='M')acum[t.id].M++; if(code==='T')acum[t.id].T++; if(code==='N')acum[t.id].N++; if(fest)acum[t.id].festivos++; if(isDom)acum[t.id].domingos++; }
      });
    });
    bloques.forEach(b=> state.trabajadores.forEach(t=>{ if(trabajoEnFinde(m,t,b)) acum[t.id].findes++; }));
  }
  return acum;
}
function elegirCandidato(tn, rol, d, m, acum, cfg, pesos, rng){
  const ds=fmt(d); const esFinde=(d.getDay()===0||d.getDay()===6);
  const fest=state.festivos.find(f=>f.fecha===ds);
  let cand = state.trabajadores.filter(t=>{
    if(!t.activo) return false; if(t.rol!==rol) return false;
    const a=getAsig(m,t.id,ds); if(a) return false;
    const p=t.preferencias;
    if(!p.turnosPermitidos.includes(tn.code)) return false;
    if(p.soloTurnos && p.soloTurnosTipo && p.soloTurnosTipo!==tn.code) return false;
    if(tn.code==='N' && p.noTrabajaNoches) return false;
    if(esFinde && p.noTrabajaFinesSemana) return false;
    if((p.diasNoDisponibles||[]).includes(ds)) return false;
    if(!esLegalAsignar(t, tn.code, d, m, cfg)) return false;
    return true;
  });
  if(!cand.length) return null;
  cand.forEach(t=>{
    const a=acum[t.id]||{};
    const maxH=Math.max(1,...Object.values(acum).map(x=>x.horas));
    const maxN=Math.max(1,...Object.values(acum).map(x=>x.N));
    const maxT=Math.max(1,...Object.values(acum).map(x=>x.T));
    const maxM=Math.max(1,...Object.values(acum).map(x=>x.M));
    const maxF=Math.max(1,...Object.values(acum).map(x=>x.findes));
    const maxD=Math.max(1,...Object.values(acum).map(x=>x.domingos));
    const maxFe=Math.max(1,...Object.values(acum).map(x=>x.festivos));
    let score=0;
    score += (pesos.horasTotales||0)*(1 - a.horas/maxH);
    if(tn.code==='N') score += (pesos.noches||0)*(1 - a.N/maxN);
    if(tn.code==='T') score += (pesos.tardes||0)*(1 - a.T/maxT);
    if(tn.code==='M') score += (pesos.mananas||0)*(1 - a.M/maxM);
    if(esFinde) score += (pesos.finesSemana||0)*(1 - a.findes/maxF);
    if(d.getDay()===0) score += (pesos.domingos||0)*(1 - a.domingos/maxD);
    if(fest) score += (pesos.festivos||0)*(1 - a.festivos/maxFe);
    if(pesos.evitarRepetirTurno){ const ayer=getCodigo(m,t.id,fmt(addDays(d,-1))); if(ayer===tn.code) score -= pesos.evitarRepetirTurno*0.5; }
    score += rng()*0.5;
    t._score=score;
  });
  cand.sort((a,b)=>b._score-a._score);
  return cand[0];
}
function esLegalAsignar(t, code, d, m, cfg){
  const cod=(off)=>{ const info=mesQueContiene(fmt(addDays(d,off))); return info?getCodigo(info.mes,t.id,fmt(addDays(d,off))):''; };
  const codMes=(off)=>getCodigo(m,t.id,fmt(addDays(d,off)));
  const maxC=(t.preferencias.maxDiasConsecutivos!=null?t.preferencias.maxDiasConsecutivos:cfg.maxDiasConsecutivos);
  if(maxC){ let c=0, off=-1; while(true){ const cd=codMes(off); if(cd&&turnoEsTrabajo(cd)){ c++; off--; } else break; } if(c>=maxC) return false; }
  if(code==='M' && !cfg.permitirMananaTrasTarde && codMes(-1)==='T') return false;
  if(code==='N'){ let c=0, off=-1; while(codMes(off)==='N'){ c++; off--; } if(c>=cfg.maxNochesConsecutivas) return false; }
  if(!cfg.permitirIncompatibles){ if((code==='M'||code==='T') && cod(-1)==='N') return false; }
  if(cfg.secuenciaNocheObligatoria && code!=='N' && cod(-1)==='N' && code!=='S') return false;
  return true;
}
function ultimosDiasTrabajados(m, tid, d){
  let c=0, off=-1;
  while(true){ const cd=getCodigo(m,tid,fmt(addDays(d,off))); if(cd&&turnoEsTrabajo(cd)){ c++; off--; } else break; }
  return c;
}
function actualizarAcum(acum, tid, code, d){
  const a=acum[tid]; if(!a) return; const tn=turnoPorCode(code); if(!tn) return;
  a.horas+=(tn.horas||0); a.total++; if(code==='M')a.M++; if(code==='T')a.T++; if(code==='N')a.N++;
  const ds=fmt(d); const fest=state.festivos.find(f=>f.fecha===ds);
  if(fest)a.festivos++; if(d.getDay()===0)a.domingos++; if(d.getDay()===0||d.getDay()===6)a.findes++;
}
// Mejora local: por semana, intentar intercambiar turnos entre compatibles si reduce desigualdad
function mejoraLocalIntercambios(m, dias, acum, cfg, pesos){
  // agrupar días en semanas (lun-dom) dentro del rango
  const lunes=dias.filter(d=>d.getDay()===1);
  lunes.forEach(l=>{
    const semana=diasEntre(l, addDays(l,6)).filter(dd=> dias.some(x=>fmt(x)===fmt(dd)));
    semana.forEach(d=>{
      const ds=fmt(d);
      // por cada par de trabajadores con turnos equivalentes (M<->M, T<->T), ver si intercambio mejora equidad de horas
      const activos = state.trabajadores.filter(t=>t.activo);
      for(let i=0;i<activos.length;i++){
        for(let j=i+1;j<activos.length;j++){
          const a=activos[i], b=activos[j];
          const ca=getCodigo(m,a.id,ds), cb=getCodigo(m,b.id,ds);
          if(!ca||!cb) continue;
          if(ca!==cb) continue; // solo mismo turno
          const ai=getAsig(m,a.id,ds), bj=getAsig(m,b.id,ds);
          if((ai&&ai.origen!==ORIGEN_AUTO)||(bj&&bj.origen!==ORIGEN_AUTO)) continue;
          if((ai&&ai.bloqueado)||(bj&&bj.bloqueado)) continue;
          // no mejora nada si son iguales; skip
        }
      }
    });
  });
  // (mejora local intencionalmente conservadora: no rompe cobertura)
}
function deshacerGeneracion(){
  const h = state.historialGeneraciones[state.historialGeneraciones.length-1];
  if(!h || h.anyo!==curAnyo || h.mes!==curMesIdx){ alert('No hay generación reciente para este mes.'); return; }
  if(!confirm('¿Deshacer la última generación y restaurar el estado previo de este mes?')) return;
  restaurarSnapshot(h.anyo, h.mes, h.snapshot);
  state.historialGeneraciones.pop();
  save(state); renderMes();
  alert('Generación deshecha.');
}
// Normaliza un mapa de asignaciones ignorando el timestamp para comparar de forma estable
function normalizarAsignaciones(asig){
  const out={};
  Object.keys(asig||{}).forEach(k=>{ const a=asig[k]; if(a&&typeof a==='object') out[k]={turno:a.turno, origen:a.origen, bloqueado:!!a.bloqueado, nota:a.nota||''}; });
  return out;
}
function compararVersiones(){
  const h = state.historialGeneraciones[state.historialGeneraciones.length-1];
  if(!h || h.anyo!==curAnyo || h.mes!==curMesIdx){ alert('No hay generación reciente para comparar.'); return; }
  const m = getMes(curAnyo, curMesIdx);
  const antes = normalizarAsignaciones(h.snapshot);
  const ahora = normalizarAsignaciones(m.asignaciones);
  const cambios=[];
  Object.keys(ahora).forEach(k=>{ if(JSON.stringify(antes[k])!==JSON.stringify(ahora[k])){ cambios.push({k, antes: antes[k]||'(vacío)', ahora: ahora[k]}); } });
  Object.keys(antes).forEach(k=>{ if(!ahora[k]) cambios.push({k, antes: antes[k], ahora:'(vacío)'}); });
  if(!cambios.length){ alert('Sin cambios respecto a la última generación.'); return; }
  const tName = id => { const t=state.trabajadores.find(x=>x.id===id); return t?t.nombreCompleto:id; };
  const html=`<h3>🔍 Comparar versiones</h3>
    <p class="hint">${cambios.length} celda(s) modificada(s) respecto al estado anterior a la última generación.</p>

function applyTurnos(){ save(state); closeModal(); renderMes(); }
function enableDragList(containerSel, dataAttr, onReorder, findByKey){
  const container=document.querySelector(containerSel); if(!container) return;
  const items=[...container.querySelectorAll('.drag-item')]; let dragKey=null;
  items.forEach(el=>{
    el.addEventListener('dragstart', e=>{ dragKey=el.dataset[dataAttr]; el.classList.add('dragging'); e.dataTransfer.effectAllowed='move'; });
    el.addEventListener('dragend', e=>{ el.classList.remove('dragging'); items.forEach(x=>x.classList.remove('drag-over')); });
    el.addEventListener('dragover', e=>{ e.preventDefault(); e.dataTransfer.dropEffect='move'; const after=_getDragAfter(containerSel,e.clientY); items.forEach(x=>x.classList.remove('drag-over')); if(after&&after.el) after.el.classList.add('drag-over'); });
    el.addEventListener('drop', e=>{ e.preventDefault(); if(!dragKey) return;
      const keysNow=[...container.querySelectorAll('.drag-item')].map(x=>x.dataset[dataAttr]); const from=keysNow.indexOf(dragKey); if(from<0) return;
      const after=_getDragAfter(containerSel,e.clientY); const [moved]=keysNow.splice(from,1); let to=keysNow.length;
      if(after&&after.before) to=after.idx; else if(after) to=after.idx; keysNow.splice(to,0,moved);
      onReorder(keysNow.map(k=>findByKey(k)).filter(Boolean)); });
  });
}
function _getDragAfter(containerSel,y){
  const items=[...document.querySelectorAll(containerSel+' .drag-item:not(.dragging)')]; let closest=null,co=-Infinity;
  items.forEach((el,i)=>{ const box=el.getBoundingClientRect(); const off=y-(box.top+box.height/2); if(off<0&&off>co){co=off;closest={el,idx:i,before:true};} });
  if(!closest&&items.length) return {el:items[items.length-1],idx:items.length,before:false}; return closest;
}

function updTurnoColor(code,v){ const t=turnoPorCode(code); if(t){t.color=v;save(state);} }
function updTurnoHoras(code,v){ const t=turnoPorCode(code); if(t){t.horas=parseFloat(v)||0;save(state);} }
function updTurnoNombre(code,v){ const t=turnoPorCode(code); if(t){t.nombre=v;save(state);} }
function updTurnoFlag(code,flag,on){ const t=turnoPorCode(code); if(t){t[flag]=on;save(state);} }
function validarCodigoTurno(v){
  v=(v||'').trim().toUpperCase();
  if(!/^[A-Z0-9]{1,4}$/.test(v)) return {ok:false, msg:'Código inválido: 1-4 caracteres alfanuméricos (A-Z, 0-9).'};
  return {ok:true, v};
}
function updTurnoCode(old,v){
  const t=turnoPorCode(old); if(!t||isTurnoBasico(old)) return;
  const r=validarCodigoTurno(v); if(!r.ok){ alert(r.msg); openTurnos(); return; }
  if(r.v!==old && state.tiposTurno.some(x=>x.code===r.v)){ alert('Ya existe un turno con código '+r.v); openTurnos(); return; }
  Object.keys(state.cuadrantes).forEach(y=>{ const a=state.cuadrantes[y]; for(let i=0;i<12;i++){ const m=a.meses[i]; if(m&&m.asignaciones) Object.keys(m.asignaciones).forEach(k=>{ const as=m.asignaciones[k]; if(as&&typeof as==='object'&&as.turno===old){ as.turno=r.v; as.actualizadoEn=nowISO(); } }); } });
  t.code=r.v; save(state); openTurnos();
}
function delTurno(code){
  if(isTurnoBasico(code)){ alert('Los turnos básicos no se pueden eliminar.'); return; }
  // ¿está en uso?
  let enUso=false;
  Object.keys(state.cuadrantes).forEach(y=>{ const a=state.cuadrantes[y]; for(let i=0;i<12;i++){ const m=a.meses[i]; if(m&&m.asignaciones) Object.keys(m.asignaciones).forEach(k=>{ if(m.asignaciones[k]&&m.asignaciones[k].turno===code) enUso=true; }); } });
  if(enUso){
    if(!confirm(`El turno ${code} está en uso. ¿Reasignar sus celdas a Libre (L) antes de eliminar? (Cancelar aborta)`)) return;
    Object.keys(state.cuadrantes).forEach(y=>{ const a=state.cuadrantes[y]; for(let i=0;i<12;i++){ const m=a.meses[i]; if(m&&m.asignaciones) Object.keys(m.asignaciones).forEach(k=>{ if(m.asignaciones[k]&&m.asignaciones[k].turno===code){ m.asignaciones[k].turno='L'; m.asignaciones[k].actualizadoEn=nowISO(); } }); } });
  } else {
    if(!confirm(`¿Eliminar el turno ${code}?`)) return;
  }
  state.tiposTurno=state.tiposTurno.filter(t=>t.code!==code);
  save(state); openTurnos();
}

function csvEsc(s){ s=String(s==null?'':s); return /[",\n;]/.test(s)?'"'+s.replaceAll('"','""')+'"':s; }
function descargarCSV(nombre, filas){ const csv=filas.map(r=>r.map(csvEsc).join(';')).join('\n'); const blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=nombre; a.click(); URL.revokeObjectURL(a.href); }
function csvMensual(){
  const m=getMes(curAnyo,curMesIdx); const dias=diasEntre(parse(m.inicio),parse(m.fin)); const stats=calcularStatsMes(m,dias);
  const filas=[['Trabajador','Rol','M','T','N','S','L','Horas','Festivos','Domingos','Sabados','Findes','Ausencias']];
  state.trabajadores.forEach(t=>{ const s=stats[t.id]||{}; filas.push([t.nombreCompleto,t.rol,s.M||0,s.T||0,s.N||0,s.S||0,s.L||0,(s.horas||0).toFixed(0),s.festivos||0,s.domingos||0,s.sabados||0,s.findes||0,s.ausencias||0]); });
  descargarCSV(`mensual_${curAnyo}_${curMesIdx+1}.csv`, filas);
}
function csvAnual(){
  const stats=calcularStatsAnyo(curAnyo);
  const filas=[['Trabajador','Rol','Horas','M','T','N','Findes','Festivos','Domingos','Sabados','Ausencias']];
  state.trabajadores.forEach(t=>{ const s=stats[t.id]||{}; filas.push([t.nombreCompleto,t.rol,(s.horas||0).toFixed(0),s.M||0,s.T||0,s.N||0,s.findes||0,s.festivos||0,s.domingos||0,s.sabados||0,s.ausencias||0]); });
  descargarCSV(`anual_${curAnyo}.csv`, filas);
}
function csvCobertura(){
  const m=getMes(curAnyo,curMesIdx); const dias=diasEntre(parse(m.inicio),parse(m.fin));
  const filas=[['Fecha','Día','Tipo','Turno','Rol','Mínimo','Real','Estado']];
  dias.forEach(d=>{ const ds=fmt(d); const c=coberturaDia(m,d);
    state.coberturas.filter(co=>coberturaAplica(co.tipoDia,c.tipoDia)).forEach(co=>{ const k=co.turno+'|'+co.rol; const real=c.conteo[k]||0; filas.push([ds,DIAS_LET[d.getDay()],c.tipoDia,co.turno,co.rol,co.min,real, real<co.min?'DÉFICIT':(real>co.min+3?'EXCEDENTE':'OK')]); });
  });
  descargarCSV(`cobertura_${curAnyo}_${curMesIdx+1}.csv`, filas);
}
function csvNochesRol(){
  const stats=calcularStatsAnyo(curAnyo);
  const filas=[['Rol','Trabajador','Noches']];
  state.trabajadores.slice().sort((a,b)=>(a.rol||'').localeCompare(b.rol||'')).forEach(t=>{ const s=stats[t.id]||{}; filas.push([t.rol,t.nombreCompleto,s.N||0]); });

function csvSaldos(){
  const stats=calcularStatsAnyo(curAnyo);
  const arr=state.trabajadores.map(t=>{ const s=stats[t.id]||{}; const obj=t.jornada.horasAnualesObjetivo||1792; const saldo=(s.horas||0)-obj*monthOfYearProgress(curAnyo); return {t,saldo}; });
  arr.sort((a,b)=>a.saldo-b.saldo);
  const filas=[['Trabajador','Rol','Horas','Objetivo','Saldo']];
  arr.forEach(x=> filas.push([x.t.nombreCompleto,x.t.rol,(stats[x.t.id].horas||0).toFixed(0), (x.t.jornada.horasAnualesObjetivo||1792), x.saldo.toFixed(0)]));
  descargarCSV(`saldos_${curAnyo}.csv`, filas);
}
function csvAusencias(){
  const filas=[['Trabajador','Tipo','Inicio','Fin','Motivo','Días']];
  state.ausencias.forEach(a=>{ const t=state.trabajadores.find(x=>x.id===a.trabajadorId); const dias=diasEntre(parse(a.inicio),parse(a.fin)).length; filas.push([t?t.nombreCompleto:'(eliminado)',a.tipo,a.inicio,a.fin,a.motivo||'',dias]); });
  descargarCSV('ausencias.csv', filas);
}
function csvCambiosManuales(){
  const m=getMes(curAnyo,curMesIdx); const filas=[['Trabajador','Fecha','Turno','Origen','Bloqueado','Nota']];
  Object.keys(m.asignaciones).forEach(k=>{ const a=m.asignaciones[k]; if(a && typeof a==='object' && a.origen===ORIGEN_MANUAL){ const [tid,fecha]=k.split('_'); const t=state.trabajadores.find(x=>x.id===tid); filas.push([t?t.nombreCompleto:tid,fecha,a.turno,a.origen,a.bloqueado?'sí':'no',a.nota||'']); } });
  descargarCSV(`cambios_manuales_${curAnyo}_${curMesIdx+1}.csv`, filas);
}

/* ============ COPIAR/PEGAR/SELECCIÓN MÚLTIPLE/DnD/ATAJOS (Fase 9) ============ */
let _portapapeles=null; // {tipo:'fila'|'patron'|'seleccion', data:...}
function copiarFila(tid){
  const m=getMes(curAnyo,curMesIdx); const dias=diasEntre(parse(m.inicio),parse(m.fin));
  const data=dias.map(d=>({fecha:fmt(d), asig:getAsig(m,tid,fmt(d))}));
  _portapapeles={tipo:'fila', data};
  alert('Fila copiada ('+data.length+' días). Usa Pegar en otra fila.');
}
function pegarFila(tid){
  if(!_portapapeles || _portapapeles.tipo!=='fila'){ alert('No hay fila copiada.'); return; }
  const m=getMes(curAnyo,curMesIdx); const dias=diasEntre(parse(m.inicio),parse(m.fin));
  if(!confirm('¿Pegar la fila copiada sobre esta fila? Se sobreescribirán las celdas no bloqueadas.')) return;
  dias.forEach((d,i)=>{ const src=_portapapeles.data[i]; if(!src||!src.asig) return; const ds=fmt(d); const cur=getAsig(m,tid,ds); if(cur&&cur.bloqueado) return; setAsig(m,tid,ds,src.asig.turno,{origen:ORIGEN_MANUAL,nota:src.asig.nota||'',bloqueado:false}); });
  save(state); renderMes();
}
// selección múltiple
let _selInicio=null, _selCells=[];
function habilitarSeleccionMultiple(){
  document.querySelectorAll('table.cuad td.cell').forEach(td=>{
    td.addEventListener('mousedown', e=>{
      if(!e.shiftKey) return;
      e.preventDefault();
      const tid=td.dataset.tid, fecha=td.dataset.fecha;
      if(_selInicio){ _seleccionarRango(_selInicio, {tid,fecha}); }
    });
    td.addEventListener('click', e=>{
      if(e.shiftKey && _selInicio){ return; }
      _selInicio={tid:td.dataset.tid, fecha:td.dataset.fecha};
    });
  });
}
function _seleccionarRango(a,b){
  _selCells.forEach(td=>td.classList.remove('selected')); _selCells=[];
  // misma fila: rango de fechas
  if(a.tid===b.tid){
    const m=getMes(curAnyo,curMesIdx); const dias=diasEntre(parse(m.inicio),parse(m.fin));
    const fa=dias.findIndex(d=>fmt(d)===a.fecha), fb=dias.findIndex(d=>fmt(d)===b.fecha);
    if(fa<0||fb<0) return;
    const [ini,fin]=[Math.min(fa,fb),Math.max(fa,fb)];
    for(let i=ini;i<=fin;i++){ const ds=fmt(dias[i]); const td=document.querySelector(`table.cuad td.cell[data-tid="${cssEscape(a.tid)}"][data-fecha="${ds}"]`); if(td){td.classList.add('selected');_selCells.push(td);} }
    _promptAsignacionSeleccion(a.tid);
  }
}
function _promptAsignacionSeleccion(tid){
  const html=`<h3>Asignar a selección</h3>
    <p class="hint">${_selCells.length} celdas seleccionadas.</p>
    <div class="row"><label class="sm">Turno</label><select id="sel-turno">${state.tiposTurno.map(t=>`<option value="${t.code}">${escaparHTML(t.code)} — ${escaparHTML(t.nombre)}</option>`).join('')}</select></div>
    <div class="actions"><button class="btn" onclick="cerrarSeleccion()">Cancelar</button><button class="btn primary" onclick="aplicarSeleccion()">Aplicar</button></div>`;
  openModal(html);
}
function aplicarSeleccion(){
  const code=document.getElementById('sel-turno').value;
  const m=getMes(curAnyo,curMesIdx);
  _selCells.forEach(td=>{ const tid=td.dataset.tid, fecha=td.dataset.fecha; const cur=getAsig(m,tid,fecha); if(cur&&cur.bloqueado) return; setAsig(m,tid,fecha,code,{origen:ORIGEN_MANUAL}); });
  save(state); closeModal(); cerrarSeleccion(); renderMes();
}
function cerrarSeleccion(){ _selCells.forEach(td=>td.classList.remove('selected')); _selCells=[]; closeModal(); }

// atajos de teclado
let _celdaActiva=null;
function habilitarAtajos(){
  document.querySelectorAll('table.cuad td.cell button').forEach(b=>{
    b.addEventListener('focus', e=>{ const td=b.closest('td'); if(td){ _celdaActiva={tid:td.dataset.tid, fecha:td.dataset.fecha}; } });
  });
}
document.addEventListener('keydown', e=>{
  // M/T/N/L/V sobre celda activa
  if(_celdaActiva && !e.target.matches('input,textarea,select')){
    const k=e.key.toUpperCase();
    if(['M','T','N','L','S'].includes(k)){
      const m=getMes(curAnyo,curMesIdx);
      const cur=getAsig(m,_celdaActiva.tid,_celdaActiva.fecha);
      if(cur&&cur.bloqueado) return;
      setAsig(m,_celdaActiva.tid,_celdaActiva.fecha,k,{origen:ORIGEN_MANUAL});
      save(state); renderCelda(_celdaActiva.tid,_celdaActiva.fecha); e.preventDefault();
    }
    if(e.key==='Escape'){ _celdaActiva=null; closeSvPop(); }
  }
});

/* ============ TEMA ============ */
function toggleTema(){
  const cur=document.documentElement.getAttribute('data-theme')==='dark'?'':'dark';
  document.documentElement.setAttribute('data-theme', cur);
  localStorage.setItem('cuadrantes_tema', cur);
  document.getElementById('themeBtn').textContent = cur==='dark'?'☀️':'🌙';
}

/* ============ VIABILIDAD ESTRUCTURAL (Fase 11) ============ */
function comprobarViabilidad(){
  const el=document.getElementById('viabilityWarn'); if(!el) return;
  // por rol, comparar plantilla activa vs máximo de mínimos diarios
  const mensajes=[];
  state.roles.forEach(r=>{
    const trabRol=state.trabajadores.filter(t=>t.activo&&t.rol===r).length;
    // máxima necesidad diaria para ese rol en cualquier tipo de día
    let maxNeces=0;
    const tipos=['laborable','sabado','domingo','festivoLaborable','festivoSabado','festivoDomingo'];
    tipos.forEach(td=>{
      const suma=state.coberturas.filter(c=>coberturaAplica(c.tipoDia,td)&&c.rol===r).reduce((s,c)=>s+(c.min||0),0);
      if(suma>maxNeces) maxNeces=suma;
    });
    if(maxNeces>0 && trabRol<maxNeces){
      mensajes.push(`${r}: ${trabRol} activo(s) vs ${maxNeces} necesarios/día`);
    }
  });
  if(mensajes.length){
    el.style.display='block';
    el.innerHTML='<b>⚠ Viabilidad estructural:</b> la plantilla puede no cubrir los mínimos configurados. '+mensajes.join(' · ')+'. Ajusta personal o coberturas.';
  } else { el.style.display='none'; }
}

/* ============ PDF + BACKUP ============ */
function exportPDF(){ window.print(); }
function exportJSON(){
  const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download=`cuadrantes_residencia_${new Date().toISOString().slice(0,10)}.json`; a.click(); URL.revokeObjectURL(a.href);
}
function importJSON(ev){
  const f=ev.target.files[0]; if(!f) return;
  const reader=new FileReader();
  reader.onload=e=>{
    try{
      const s=JSON.parse(e.target.result);
      if(s.version!==3 && !s.centro){ throw new Error('formato no reconocido'); }
      if(!confirm('Esto reemplazará todos los datos actuales. ¿Continuar?')) return;
      migrate(s); save(s); closeModal(); showView('anios');
      alert('Datos importados correctamente.');
    }catch(err){ alert('Archivo no válido: '+err.message); }
  };
  reader.readAsText(f); ev.target.value='';
}
function borrarTodo(){
  if(!confirm('¿Borrar TODOS los datos y reiniciar con datos de demostración? No se puede deshacer.')) return;
  if(!confirm('Última confirmación: se perderán trabajadores, turnos, coberturas, festivos y cuadrantes.')) return;
  localStorage.removeItem(STORE_KEY);
  state=load(); renderAnios(); alert('Datos reiniciados.');
}

  proyectarTodasAusencias();

  if(last){ try{ const {anyo,mesIdx}=JSON.parse(last); if(state.cuadrantes[anyo]&&state.cuadrantes[anyo].meses[mesIdx]&&state.cuadrantes[anyo].meses[mesIdx].inicio){ curAnyo=anyo; curMesIdx=mesIdx; showView('mes'); renderMes(); return; } }catch(e){} }
  renderAnios();
})();
